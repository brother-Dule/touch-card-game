<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b3d26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Tač – igra kartama za dva igrača na jednom telefonu.">
<title>Tač</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="glow" hidden></div>
<main id="app">
  <section class="zone top" id="zone-1" data-player="1"></section>
  <section id="middle">
    <button id="menu-btn" class="icon-btn" aria-label="Meni" data-i18n-aria="menu">☰</button>
    <div class="slot center" data-slot="center" id="center"></div>
  </section>
  <section class="zone bottom" id="zone-0" data-player="0"></section>
</main>

<div id="touch-overlay" class="overlay-msg" hidden>
  <div class="msg top"></div>
  <div class="big" data-i18n="touch">TAČ!</div>
  <div class="msg bottom"></div>
</div>

<div id="win-overlay" class="modal" hidden>
  <div class="win-side top"></div>
  <button id="again-btn" class="primary" data-i18n="newGame">Nova igra</button>
  <div class="win-side bottom"></div>
</div>

<div id="menu" class="modal">
  <div class="panel">
    <h1 data-i18n="title">Tač</h1>
    <p class="sub" data-i18n="sub">Igra kartama za dva igrača. Telefon stavite na sto između sebe.</p>

    <label class="row">
      <span><b data-i18n="optLang">Jezik</b></span>
      <select id="opt-lang"></select>
    </label>

    <label class="row">
      <span>
        <b data-i18n="optTimer">Vremensko ograničenje</b>
        <small data-i18n="optTimerHint">Isključi za decu i početnike</small>
      </span>
      <input type="checkbox" id="opt-timer" class="switch">
    </label>
    <label class="row" id="row-seconds">
      <span><b data-i18n="optSeconds">Vreme za potez</b></span>
      <select id="opt-seconds">
        <option value="3">3 s</option>
        <option value="5">5 s</option>
        <option value="8">8 s</option>
        <option value="10">10 s</option>
      </select>
    </label>
    <label class="row">
      <span>
        <b data-i18n="optAuto">Automatski TAČ</b>
        <small data-i18n="optAutoHint">Isključeno: protivnik sam pritiska dugme TAČ! pre svog prvog poteza</small>
      </span>
      <input type="checkbox" id="opt-auto" class="switch">
    </label>

    <div class="buttons">
      <button id="resume-btn" class="secondary" hidden data-i18n="resume">Nastavi</button>
      <button id="start-btn" class="primary">Počni igru</button>
    </div>

    <details>
      <summary data-i18n="rulesTitle">Pravila</summary>
      <ul data-i18n-html="rules"></ul>
    </details>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
